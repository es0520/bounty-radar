name: Bounty radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,12 * * *'

permissions:
  contents: read

concurrency:
  group: bounty-radar
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: node --version
      - run: node radar.mjs
